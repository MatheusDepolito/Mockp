query admins(
  $distinct: [AdminScalarFieldEnum!]
  $skip: Float
  $take: Float
  $cursor: AdminWhereUniqueInput
  $orderBy: [AdminOrderByWithRelationInput!]
  $where: AdminWhereInput
) {
  admins(
    distinct: $distinct
    skip: $skip
    take: $take
    cursor: $cursor
    orderBy: $orderBy
    where: $where
  ) {
