  }
}

fragment AgentInquiryFields on Inquiry {
  id
  contactNotes
  passcode
  status
  startTime
  endTime
  property {
    address {
      lat
      lng
    }
  }
}

query myPickupTrips(
  $distinct: [InquiryScalarFieldEnum!]
  $skip: Float
  $take: Float
  $orderBy: [InquiryOrderByWithRelationInput!]
  $where: InquiryWhereInput
) {
  inquiriesForAgent(
    distinct: $distinct
    skip: $skip
    take: $take
    orderBy: $orderBy
    where: $where
  ) {
    ...AgentInquiryFields
    agentAssignment {
      visitLat
      visitLng
      assignedAgentId
    }
  }
  inquiriesCount(where: $where) {
    count
  }
}
