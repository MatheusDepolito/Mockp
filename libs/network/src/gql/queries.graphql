mutation RegisterWithCredentials(
  $registerWithCredentialsInput: RegisterWithCredentialsInput!
) {
  registerWithCredentials(
    registerWithCredentialsInput: $registerWithCredentialsInput
  ) {
    updatedAt
    uid
    name
    image
    createdAt
  }
}

query Brokerages(
  $distinct: [BrokerageScalarFieldEnum!]
  $orderBy: [BrokerageOrderByWithRelationInput!]
  $where: BrokerageWhereInput
  $cursor: BrokerageWhereUniqueInput
  $skip: Float
  $take: Float
) {
  brokerages(
    distinct: $distinct
    orderBy: $orderBy
    where: $where
    cursor: $cursor
    skip: $skip
    take: $take
  ) {
    createdAt
    description
    displayName
    properties {
      id
    }
    id
    brokerageManagers {
      uid
    }
    updatedAt
  }
}

mutation Login($loginInput: LoginInput!) {
  login(loginInput: $loginInput) {
    token
    user {
      uid
      name
      image
    }
  }
}

query GetAuthProvider($uid: String!) {
  getAuthProvider(uid: $uid) {
    uid
    type
  }
}

mutation RegisterWithProvider(
  $registerWithProviderInput: RegisterWithProviderInput!
) {
  registerWithProvider(registerWithProviderInput: $registerWithProviderInput) {
    uid
  }
}

query SearchProperties(
  $dateFilter: DateFilterInput!
  $locationFilter: LocationFilterInput!
  $featuresFilter: PropertyFeatureWhereInput
  $propertyFilter: PropertyFilter
) {
  searchProperties(
    dateFilter: $dateFilter
    locationFilter: $locationFilter
    featuresFilter: $featuresFilter
    propertyFilter: $propertyFilter
  ) {
    id
    address {
      lat
      lng
      address
    }
    images
    displayName
    listPrice
    featureCounts {
      type
      count
    }
    verification {
      verified
    }
  }
}

mutation CreatePropertyFeature($createPropertyFeatureInput: CreatePropertyFeatureInput!) {
  createPropertyFeature(createPropertyFeatureInput: $createPropertyFeatureInput) {
    id
  }
}

query myBrokerage {
  myBrokerage {
    id
    properties {
      displayName
      id
      description
      address {
        id
        address
        lat
        lng
      }
    }
    createdAt
    displayName
  }
}

mutation CreateBrokerage($createBrokerageInput: CreateBrokerageInput!) {
  createBrokerage(createBrokerageInput: $createBrokerageInput) {
    id
  }
}

query Properties(
  $skip: Float
  $take: Float
  $cursor: PropertyWhereUniqueInput
  $orderBy: [PropertyOrderByWithRelationInput!]
  $where: PropertyWhereInput
) {
  properties(
    skip: $skip
    take: $take
    cursor: $cursor
    orderBy: $orderBy
    where: $where
  ) {
    id
    displayName
    description
    images
    verification {
      verified
    }
    address {
      id
      lat
      lng
      address
    }
    featureCounts {
      type
      count
    }
  }

  propertiesCount(where: $where) {
    count
  }
}

mutation CreateProperty($createPropertyInput: CreatePropertyInput!) {
  createProperty(createPropertyInput: $createPropertyInput) {
    id
  }
}

fragment AgentFields on Agent {
  image
  uid
  displayName
}

fragment InquiryFields on Inquiry {
  id
  listPriceAtInquiry
  endTime
  startTime
  contactNotes
  passcode
  status
  inquiryTimeline {
    status
    timestamp
  }
  agentAssignment {
    assignedAgent {
      ...AgentFields
    }
  }
  property {
    displayName
    images
    address {
      address
      lat
      lng
    }
  }
}

query InquiriesForCustomer(
  $skip: Float
  $take: Float
  $cursor: InquiryWhereUniqueInput
  $orderBy: [InquiryOrderByWithRelationInput!]
  $where: InquiryWhereInput
  $distinct: [InquiryScalarFieldEnum!]
) {
  inquiriesForCustomer(
    skip: $skip
    take: $take
    cursor: $cursor
    orderBy: $orderBy
    where: $where
    distinct: $distinct
  ) {
    ...InquiryFields
  }

  inquiriesCount(where: $where) {
    count
  }
}

query InquiriesForProperty(
  $skip: Float
  $take: Float
  $cursor: InquiryWhereUniqueInput
  $orderBy: [InquiryOrderByWithRelationInput!]
  $where: InquiryWhereInput
  $distinct: [InquiryScalarFieldEnum!]
) {
  inquiriesForProperty(
    skip: $skip
    take: $take
    cursor: $cursor
    orderBy: $orderBy
    where: $where
    distinct: $distinct
  ) {
    ...InquiryFields
  }

  inquiriesCount(where: $where) {
    count
  }
}

mutation createInquiryTimeline(
