query companyAgents(
  $distinct: [AgentScalarFieldEnum!]
  $skip: Float
  $take: Float
  $cursor: AgentWhereUniqueInput
  $orderBy: [AgentOrderByWithRelationInput!]
  $where: AgentWhereInput
) {
  companyAgents(
    distinct: $distinct
    skip: $skip
    take: $take
    cursor: $cursor
    orderBy: $orderBy
    where: $where
