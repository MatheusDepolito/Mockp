services:
  db:
    container_name: mockp_db
    image: postgres:18
    restart: always
    ports:
      - 2000:5432
    environment:
      POSTGRES_USER: mockp
      POSTGRES_DB: mockp_db
      POSTGRES_PASSWORD: mockp
    volumes:
      - db_data_mockp:/var/lib/postgresql
volumes:
  db_data_mockp:
